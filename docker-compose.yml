version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moonlight_postgres
    restart: always
    environment:
      POSTGRES_USER: moonlight_user
      POSTGRES_PASSWORD: moonlight_password_2026
      POSTGRES_DB: moonlight_db
    ports:
      - "5432:5432"
    volumes:
      - moonlight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonlight_user -d moonlight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moonlight_shop_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://moonlight_user:moonlight_password_2026@postgres:5432/moonlight_db
      - HOST=0.0.0.0
      - PORT=8001
      - MEDIA_CACHE_DIR=/app/media_cache
    volumes:
      - moonlight_media:/app/media_cache

volumes:
  moonlight_pgdata:
    driver: local
  moonlight_media:
    driver: local
